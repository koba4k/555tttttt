/* ============ Модуль «Новости» ============ */
const News = (() => {
  const T = NEWS.topics;
  let items = [], status = {}, loading = false, updated = null, root = null, topic = "all", onlyDrops = false, newIds = new Set(), raf = 0;
  const PROXIES = [
    ...(NEWS.proxy ? [u => NEWS.proxy + encodeURIComponent(u)] : []),
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  ];
  async function tfetch(url, ms = 12000) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
    try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.text(); }
    finally { clearTimeout(t); }
  }
  async function viaProxy(url) {
    let err;
    for (const p of PROXIES) {
      try { const t = await tfetch(p(url)); if (/<(rss|feed|\?xml)/i.test(t.slice(0, 600))) return t; err = new Error("не RSS"); } catch (e) { err = e; }
    }
    throw err || new Error("нет ответа");
  }
  const strip = h => ((new DOMParser().parseFromString(h || "", "text/html").body.textContent) || "").replace(/\s+/g, " ").trim().slice(0, 320);
  function parseFeed(xml) {
    const doc = new DOMParser().parseFromString(xml, "text/xml");
    if (doc.querySelector("parsererror")) throw new Error("битый XML");
    return [...doc.querySelectorAll("item, entry")].map(n => {
      const g = s => n.querySelector(s)?.textContent?.trim() || "";
      const l = n.querySelector("link[href]");
      return { title: g("title"), text: strip(g("description") || g("summary") || g("content")), link: l ? l.getAttribute("href") : g("link"),
        ts: Date.parse(g("pubDate") || g("published") || g("updated")) || 0, src: g("source") };
    }).filter(x => x.title && x.link);
  }
  const topicsOf = (txt, hint) => { const s = new Set(hint ? [hint] : []); for (const k in T) if (T[k].re.test(txt)) s.add(k); return [...s]; };

  const tasks = () => [
    ...NEWS.google.map(g => ({ group: "Google News", run: async () => {
      const u = "https://news.google.com/rss/search?q=" + encodeURIComponent(g.q + " when:14d") + "&hl=en-US&gl=US&ceid=US:en";
      return parseFeed(await viaProxy(u)).map(x => ({ ...x, source: x.src || "Google News", title: x.title.replace(/\s+-\s+[^-]+$/, "") }));
    } })),
    ...NEWS.rss.map(r => ({ group: "RSS", run: async () => parseFeed(await viaProxy(r.url)).map(x => ({ ...x, source: r.name, hint: r.topic })) })),
    ...NEWS.x.map(([h, tp]) => ({ group: "X (Nitter)", run: async () => {
      let err;
      for (const inst of NEWS.nitter) {
        try {
          return parseFeed(await viaProxy(`https://${inst}/${h}/rss`)).map(x => ({ ...x, source: "@" + h, hint: tp,
            link: x.link.replace(/https?:\/\/[^/]+\/([^/]+)\/status\/(\d+).*/, "https://x.com/$1/status/$2") }));
        } catch (e) { err = e; }
      }
      throw err || new Error("нет зеркал");
    } })),
    ...NEWS.bsky.map(h => ({ group: "Bluesky", run: async () => {
      const j = JSON.parse(await tfetch("https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?limit=30&filter=posts_no_replies&actor=" + encodeURIComponent(h)));
      return (j.feed || []).map(f => ({ title: (f.post.record.text || "").slice(0, 140), text: f.post.record.text || "", ts: Date.parse(f.post.record.createdAt) || 0,
        link: `https://bsky.app/profile/${f.post.author.handle}/post/${f.post.uri.split("/").pop()}`, source: "@" + h }));
    } })),
  ];

  async function refresh() {
    if (loading) return;
    loading = true; status = {}; paint();
    const list = tasks(), all = [], q = list.slice();
    list.forEach(t => (status[t.group] ||= { ok: 0, fail: 0, total: 0 }).total++);
    await Promise.all(Array.from({ length: 5 }, async () => {
      while (q.length) {
        const t = q.shift();
        try { all.push(...await t.run()); status[t.group].ok++; } catch (e) { status[t.group].fail++; }
        paint();
      }
    }));
    const now = Date.now(), maxAge = NEWS.maxAgeDays * 864e5, seenTitles = new Set(), out = [];
    for (const x of all.sort((a, b) => b.ts - a.ts)) {
      if (!x.ts || now - x.ts > maxAge) continue;
      const txt = x.title + " " + x.text, tp = topicsOf(txt, x.hint);
      if (!tp.length || !NEWS.drop.test(txt)) continue;
      const key = x.link.split("?")[0], tk = x.title.toLowerCase().replace(/\W+/g, "").slice(0, 60);
      if (seenTitles.has(key) || seenTitles.has(tk)) continue;
      seenTitles.add(key); seenTitles.add(tk);
      out.push({ ...x, id: key, topics: tp, drop: NEWS.drop.test(txt) });
    }
    items = out.slice(0, 150);
    try {
      const seen = new Set(JSON.parse(localStorage.getItem("news:seen") || "[]"));
      newIds = seen.size ? new Set(items.filter(i => !seen.has(i.id)).map(i => i.id)) : new Set();
      items.forEach(i => seen.add(i.id));
      localStorage.setItem("news:seen", JSON.stringify([...seen].slice(-600)));
    } catch (e) {}
    loading = false; updated = new Date(); paint();
  }
  function paint() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  const rtf = new Intl.RelativeTimeFormat("ru", { numeric: "auto" });
  function ago(ts) {
    const m = Math.round((ts - Date.now()) / 6e4);
    if (Math.abs(m) < 60) return rtf.format(m, "minute");
    if (Math.abs(m) < 1440) return rtf.format(Math.round(m / 60), "hour");
    return rtf.format(Math.round(m / 1440), "day");
  }
  function draw() {
    if (!root?.isConnected) return;
    const rb = $("#n-refresh", root); rb.disabled = loading; rb.classList.toggle("spin", loading);
    $("#n-upd", root).textContent = loading ? "Загружаем источники…" : updated ? "Обновлено в " + updated.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "";
    $("#n-chips", root).innerHTML = Object.entries(status).map(([g, s]) => `<span class="chip">${g}: ${s.ok}/${s.total}${s.fail ? " · ошибок " + s.fail : ""}</span>`).join("");
    const x = status["X (Nitter)"];
    $("#n-banner", root).innerHTML = !loading && x && x.ok === 0
      ? `<div class="banner">Аккаунты X не загрузились: бесплатных способов читать X почти не осталось. Добавьте RSS-ленты аккаунтов из rss.app в <code>NEWS.rss</code> — тогда они появятся здесь.</div>` : "";
    $("#n-filters", root).innerHTML = [["all", "Все"], ...Object.entries(T).map(([k, v]) => [k, v.label])]
      .map(([k, l]) => `<button class="tab${topic === k ? " on" : ""}" data-t="${k}">${l}</button>`).join("");
    const shown = items.filter(i => (topic === "all" || i.topics.includes(topic)));
    $("#n-list", root).innerHTML = shown.length ? shown.map(i => `<a class="nw" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">
      <h4>${esc(i.title)}</h4>${i.text && i.text !== i.title ? `<p>${esc(i.text)}</p>` : ""}
      <div class="m"><span>${esc(i.source)}</span><span>${ago(i.ts)}</span>
        ${i.topics.map(t => `<span class="tag t">${esc(T[t].label)}</span>`).join("")}${newIds.has(i.id) ? '<span class="tag new">NEW</span>' : ""}</div></a>`).join("")
      : `<div class="sub" style="padding:30px 0">${loading ? "Загружаем…" : updated ? "Пока ничего про airdrop / токен по этим темам не найдено." : ""}</div>`;
  }
  return {
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Новости: дропы</h1></div>
        <div class="chips" id="n-chips"></div><div id="n-banner"></div>
        <div class="bar"><button class="btn primary" id="n-refresh">${ico.refresh}<span>Обновить</span></button><span class="upd" id="n-upd"></span></div>
        <div class="tabs" id="n-filters"></div>
        <div class="news" id="n-list"></div>`;
      $("#n-refresh", el).onclick = refresh;
      el.onclick = e => {
        const t = e.target.closest("[data-t]"), d = e.target.closest("[data-d]");
        if (t) { topic = t.dataset.t; draw(); } else if (d) { onlyDrops = !onlyDrops; draw(); }
      };
      draw();
      if (!updated && !loading) refresh();
    },
  };
})();

/* ============ Модуль «Solana» ============
   RPC: публичные узлы Solana; цены: DeFiLlama. */
const SolWallets = (() => {
  const SOLMINT = "So11111111111111111111111111111111111111112";
  const PROGRAMS = ["TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA", "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"];
  const items = SOL_WALLETS.map((w, i) => ({ address: w.address, name: w.name || "Solana " + (i + 1), idx: i, status: "idle" }));
  let loading = false, updated = null, root = null, raf = 0;
  const n4 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 });

  async function rpc(method, params, urls) {
    let err;
    for (const url of [...new Set(urls)]) {
      try {
        const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json(); if (j.error) throw new Error(j.error.message);
        return j.result;
      } catch (e) { err = new Error(new URL(url).hostname + ": " + e.message); }
    }
    throw err;
  }
  async function prices(mints) {
    const out = {}, keys = [SOLMINT, ...mints];
    for (let i = 0; i < keys.length; i += 30) {
      try {
        const r = await fetch("https://coins.llama.fi/prices/current/" + keys.slice(i, i + 30).map(m => "solana:" + m).join(","));
        Object.entries((await r.json()).coins || {}).forEach(([k, v]) => out[k.slice(7)] = v);
      } catch (e) {}
    }
    return out;
  }
  async function load(it) {
    const U = list => [...(SOL_RPC.private ? [SOL_RPC.private] : []), ...list];
    const [bal, ...tk] = await Promise.allSettled([
      rpc("getBalance", [it.address], U(SOL_RPC.balance)),
      ...PROGRAMS.map(pr => rpc("getTokenAccountsByOwner", [it.address, { programId: pr }, { encoding: "jsonParsed" }], U(SOL_RPC.tokens)))]);
    if (bal.status === "rejected" && tk.every(t => t.status === "rejected")) throw bal.reason;
    const warn = [];
    let sol = 0;
    if (bal.status === "fulfilled") sol = bal.value.value / 1e9; else warn.push("Баланс SOL не загрузился (" + bal.reason.message + ")");
    if (tk[0].status === "rejected") warn.push("Токены не загрузились: публичные RPC блокируют этот запрос (" + tk[0].reason.message + "). Укажите свой бесплатный RPC в SOL_RPC.private.");
    const byMint = {}; let nfts = 0;
    for (const res of tk) if (res.status === "fulfilled") for (const a of res.value.value) {
      const info = a.account.data.parsed.info, ta = info.tokenAmount, ui = ta.uiAmount || 0;
      if (!ui) continue;
      if (ta.decimals === 0 && ui === 1) { nfts++; continue; }
      byMint[info.mint] = (byMint[info.mint] || 0) + ui;
    }
    const px = await prices(Object.keys(byMint)), tokens = []; let hidden = 0;
    for (const [m, amt] of Object.entries(byMint)) {
      const p = px[m];
      if (!p?.price) { hidden++; continue; }
      tokens.push({ sym: p.symbol || m.slice(0, 4) + "…", amt, price: p.price, usd: amt * p.price });
    }
    const solPrice = px[SOLMINT]?.price || 0, solUsd = sol * solPrice;
    if (sol && !solPrice) warn.push("Не удалось получить цену SOL");
    const rows = [{ sym: "SOL", amt: sol, price: solPrice, usd: solUsd }, ...tokens.filter(t => t.usd >= 0.01)].sort((a, b) => b.usd - a.usd);
    Object.assign(it, { status: "ok", error: null, warn: warn.join(". "), sol, solUsd, solPrice, nfts, hidden, rows, nTok: tokens.length, value: solUsd + tokens.reduce((s, t) => s + t.usd, 0) });
  }
  async function run(it) {
    it.status = "loading"; paint();
    try { await load(it); } catch (e) { it.status = "error"; it.error = e.message || "ошибка"; }
    paint();
  }
  async function refresh() {
    if (loading) return;
    loading = true; paint();
    await Promise.all(items.map(run));
    loading = false; updated = new Date(); paint();
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && root?.isConnected && updated && Date.now() - updated > 60000) refresh();
  });
  function paint() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  const fp = p => !p ? "—" : p >= 1 ? fmtUsd(p) : "$" + p.toPrecision(3);

  function section(it) {
    const head = `<div class="head" style="margin:14px 0 8px"><div style="display:flex;align-items:center;gap:10px;min-width:0">${avatar(it.address)}
      <div style="min-width:0"><div class="name">${esc(it.name)}</div>
      <button class="addr" data-copy="${it.address}" title="Скопировать адрес">${short(it.address)}${ico.copy}</button></div></div>
      <a class="lnk" style="font-size:12px" href="https://solscan.io/account/${it.address}" target="_blank" rel="noopener">Solscan</a></div>`;
    if (it.status === "error") return head + `<div class="banner">Не удалось загрузить: ${esc(it.error)}. <button class="lnk" data-retry="${it.idx}">Повторить</button></div>`;
    if (it.status !== "ok") return head + `<div class="kpis">${Array(4).fill('<div class="kpi"><span class="sk" style="width:70px"></span><span class="sk" style="width:100px;height:18px;margin-top:8px"></span></div>').join("")}</div>`;
    const kpi = (l, v, n) => `<div class="kpi"><small>${l}</small><div class="v">${v}</div><div class="n">${n || ""}</div></div>`;
    const tot = it.value || 1;
    return head + (it.warn ? `<div class="banner">${esc(it.warn)}</div>` : "") + `<div class="kpis">${kpi("Общий баланс", fmtUsd(it.value))}${kpi("SOL", n4.format(it.sol), fmtUsd(it.solUsd))}
      ${kpi("Токены с ценой", it.nTok, it.hidden ? "ещё " + it.hidden + " без цены (не в сумме)" : "")}${kpi("NFT", it.nfts, "не оцениваются")}</div>
      <div class="card"><div class="tbl-w"><table class="tbl"><tr><th>Токен</th><th>Количество</th><th>Цена</th><th>Стоимость</th><th>Доля</th></tr>
      ${it.rows.map(r => `<tr><td>${esc(r.sym)}</td><td>${n4.format(r.amt)}</td><td>${fp(r.price)}</td><td>${fmtUsd(r.usd)}</td><td>${(r.usd / tot * 100).toFixed(1)}%</td></tr>`).join("")}</table></div></div>`;
  }
  function draw() {
    if (!root?.isConnected) return;
    const rb = $("#o-refresh", root); rb.disabled = loading; rb.classList.toggle("spin", loading);
    $("#o-upd", root).textContent = updated ? "Обновлено в " + updated.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
    $("#o-body", root).innerHTML = items.map(section).join("");
  }
  return {
    refresh, ensure() { if (!updated && !loading) return refresh(); },
    summary() {
      const ok = items.filter(i => i.status === "ok");
      return { n: items.length, ok: ok.length, loading, total: ok.reduce((s, i) => s + i.value, 0), sol: ok.reduce((s, i) => s + i.sol, 0) };
    },
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Solana</h1></div>
        <div class="bar"><button class="btn primary" id="o-refresh">${ico.refresh}<span>Обновить</span></button><span class="upd" id="o-upd"></span></div>
        <div id="o-body"></div>`;
      $("#o-refresh", el).onclick = refresh;
      el.onclick = e => {
        const c = e.target.closest("[data-copy]"), r = e.target.closest("[data-retry]");
        if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => { const t = c.innerHTML; c.textContent = "Скопировано"; setTimeout(() => c.innerHTML = t, 900); }); return; }
        if (r) run(items[+r.dataset.retry]).then(() => { updated = new Date(); paint(); });
      };
      draw();
      if (!updated && !loading) refresh();
    },
  };
})();

/* ============ Модуль «Side $» ============
   Лист «Side $»: Месяц | PLN | EUR | UAH [| Итого $]. Если колонки с $ нет — итог считается по текущему курсу. */
const SideIncome = (() => {
  const kind = c => {
    const t = String(c || "").toLowerCase();
    if (/pln|zł|zl\b|зл|злот/.test(t)) return "pln";
    if (/eur|€|евро|euro/.test(t)) return "eur";
    if (/uah|грн|₴|hrn|гривн/.test(t)) return "uah";
    if (/usd|\$|долл|итого|total|сумма|всего/.test(t)) return "usd";
    if (/month|месяц|мес\b|дата|date|период/.test(t)) return "month";
    return null;
  };
  let rows = null, data = null, rates = null, error = null, loading = false, updated = null, root = null, showRaw = false;
  const nf = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });
  const mf = v => v == null ? "—" : nf.format(v);

  async function getRates() {
    for (const u of ["https://open.er-api.com/v6/latest/USD", "https://api.exchangerate-api.com/v4/latest/USD"]) {
      try { const r = (await (await fetch(u)).json()).rates; if (r?.PLN && r?.EUR && r?.UAH) return r; } catch (e) {}
    }
    return null;
  }
  const monthName = s => {
    let d = null, m;
    if ((m = /^(\d{4})-(\d{2})(-\d{2})?$/.exec(s))) d = new Date(+m[1], +m[2] - 1, 1);
    else if ((m = /^\d{1,2}[./](\d{1,2})[./](\d{4})$/.exec(s))) d = new Date(+m[2], +m[1] - 1, 1);
    if (!d) return s;
    const t = d.toLocaleDateString("ru-RU", { month: "long", year: "numeric" }); return t[0].toUpperCase() + t.slice(1);
  };
  // Формат «блоками»: ячейка с названием месяца → под ней заголовки Profit ZL / EURO / UAH → строка(и) с суммами.
  // Следующие месяцы могут идти ниже или правее.
  const MONTHS = /^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|янв|фев|мар|апр|ма[йя]|июн|июл|авг|сен|окт|ноя|дек|stycz|luty|marz|kwie|maj|czer|lip|sierp|wrze|paźdz|listopad|grud)/i;
  const MIDX = s => { const t = s.toLowerCase(); const en = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].findIndex(m => t.startsWith(m)); return en; };
  function parseBlocks(rs) {
    const out = [];
    for (let i = 0; i < rs.length - 1; i++) for (let j = 0; j < (rs[i] || []).length; j++) {
      const lab = (rs[i][j] || "").trim();
      if (!lab || lab.length > 30 || !MONTHS.test(lab) || Pythenians.parseNum(lab) != null) continue;
      const hdr = rs[i + 1] || [], cols = {};
      for (let c = j; c < hdr.length && (hdr[c] || "").trim(); c++) { const k = kind(hdr[c]); if (["pln", "eur", "uah", "usd"].includes(k) && !(k in cols)) cols[k] = c; }
      if (Object.keys(cols).length < 2) continue;
      const v = { label: monthName(lab) }; let any = false;
      for (let r = i + 2; r < rs.length; r++) {
        const vals = Object.entries(cols).map(([k, c]) => [k, Pythenians.parseNum((rs[r] || [])[c])]);
        if (vals.every(([, n]) => n == null)) break;
        vals.forEach(([k, n]) => { if (n != null) { v[k] = (v[k] || 0) + n; any = true; } });
      }
      if (any) out.push(v);
    }
    const idx = out.map(v => MIDX(v.label));
    if (out.length > 1 && idx.every(x => x >= 0) && idx.every((x, i) => i === 0 || x < idx[i - 1])) out.reverse();   // месяцы записаны сверху вниз от нового к старому
    return out;
  }
  const parse = rs => { const b = parseBlocks(rs); return b.length ? b : parseFlat(rs); };
  function parseFlat(rs) {
    let hi = -1, cols = { month: 0, pln: 1, eur: 2, uah: 3, usd: 4 };
    for (let i = 0; i < Math.min(rs.length, 15); i++) {
      const m = {}; rs[i].forEach((c, j) => { const k = kind(c); if (k && !(k in m)) m[k] = j; });
      if (["pln", "eur", "uah"].filter(k => k in m).length >= 2) { hi = i; cols = { month: 0, ...m }; break; }
    }
    const out = [];
    for (let i = hi + 1; i < rs.length; i++) {
      const r = rs[i], label = (r[cols.month] || "").trim();
      if (!label || /итого|total|sum|всего/i.test(label)) continue;
      const v = { label: monthName(label) }; let any = false;
      for (const k of ["pln", "eur", "uah", "usd"]) {
        if (cols[k] == null) continue;
        const n = Pythenians.parseNum(r[cols[k]]);
        if (n != null) { v[k] = n; any = true; }
      }
      if (any) out.push(v);
    }
    return out;
  }
  const usdOf = v => v.usd != null ? v.usd : rates ? (v.pln || 0) / rates.PLN + (v.eur || 0) / rates.EUR + (v.uah || 0) / rates.UAH : null;

  async function refresh() {
    if (loading) return;
    loading = true; error = null; draw();
    try {
      const [r, rt] = await Promise.all([
        fetch(`https://docs.google.com/spreadsheets/d/${SIDE.sheetId}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(SIDE.sheet)}`), getRates()]);
      rates = rt;
      if (!r.ok) throw new Error("access");
      const t = await r.text();
      if (t.trimStart().startsWith("<")) throw new Error("access");
      rows = Pythenians.parseCSV(t);
      data = parse(rows);
      if (!data.length) throw new Error("nomatch");
      updated = new Date();
    } catch (e) {
      error = e.message === "nomatch"
        ? "Лист загружен, но я не нашёл строки с месяцами и суммами. Ожидаю блоки: название месяца, под ним заголовки Profit ZL / EURO / UAH и строку с суммами. Откройте «Показать данные листа» и напишите, как они выглядят."
        : "Не удалось прочитать лист «" + SIDE.sheet + "». Проверьте название вкладки и доступ к таблице («Все, у кого есть ссылка» → Читатель).";
    }
    loading = false; draw();
  }

  function draw() {
    if (!root?.isConnected) return;
    const rb = $("#d-refresh", root); rb.disabled = loading; rb.classList.toggle("spin", loading);
    $("#d-upd", root).textContent = updated ? "Обновлено в " + updated.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "";
    const body = $("#d-body", root);
    const raw = rows ? `<button class="btn" data-raw="1">${showRaw ? "Скрыть" : "Показать"} данные листа</button>` +
      (showRaw ? `<div class="raw"><table>${rows.slice(0, 60).map(r => "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>").join("")}</table></div>` : "") : "";
    if (error) { body.innerHTML = `<div class="banner">${esc(error)}</div>${raw}`; return; }
    if (!data) { body.innerHTML = `<div class="kpis">${Array(4).fill('<div class="kpi"><span class="sk" style="width:80px"></span><span class="sk" style="width:100px;height:18px;margin-top:8px"></span></div>').join("")}</div>`; return; }

    const tot = data.map(usdOf), last = data.length - 1;
    const valid = tot.filter(v => v != null), sum = valid.reduce((a, b) => a + b, 0);
    const prev = last > 0 ? tot[last - 1] : null, cur = tot[last];
    const diff = cur != null && prev != null ? cur - prev : null, pct = diff != null && prev > 0 ? diff / prev * 100 : null;
    const cls = v => v == null ? "" : v >= 0 ? "up" : "down", pl = v => v >= 0 ? "+" : "−";
    const usd = v => v == null ? "—" : fmtUsd(v);
    const kpi = (l, v, n, c) => `<div class="kpi"><small>${l}</small><div class="v ${c || ""}">${v}</div><div class="n">${n || ""}</div></div>`;
    const cs = k => data.reduce((s, v) => s + (v[k] || 0), 0);
    const kpis = kpi("Последний месяц", usd(cur), esc(data[last].label)) +
      kpi("К прошлому месяцу", diff == null ? "—" : pl(diff) + fmtUsd(Math.abs(diff)), pct == null ? "" : `${pl(pct)}${Math.abs(pct).toFixed(1)}%`, cls(diff)) +
      kpi("Среднее в месяц", usd(valid.length ? sum / valid.length : null), `за ${valid.length} мес.`) +
      kpi("Всего за период", usd(sum), `${mf(cs("pln"))} zł · ${mf(cs("eur"))} € · ${mf(cs("uah"))} ₴`);

    const shown = data.slice(-18), st = tot.slice(-18), mx = Math.max(...st.filter(v => v != null), 1);
    const chart = `<div class="card" style="margin-bottom:10px"><h3>Итого по месяцам, $</h3><div class="mchart">${shown.map((v, i) =>
      `<div class="mc" title="${esc(v.label)}: ${usd(st[i])}"><b>${st[i] == null ? "" : Math.round(st[i])}</b><i style="height:${st[i] == null ? 0 : Math.max(2, st[i] / mx * 78)}%"></i><span>${esc(v.label.slice(0, 3))}</span></div>`).join("")}</div></div>`;

    const fromSheet = data.some(v => v.usd != null);
    const trs = data.map((v, i) => {
      const d = i > 0 && tot[i] != null && tot[i - 1] > 0 ? (tot[i] - tot[i - 1]) / tot[i - 1] * 100 : null;
      return `<tr><td>${esc(v.label)}</td><td>${mf(v.pln)}</td><td>${mf(v.eur)}</td><td>${mf(v.uah)}</td><td><b>${usd(tot[i])}</b></td><td class="${cls(d)}">${d == null ? "—" : pl(d) + Math.abs(d).toFixed(1) + "%"}</td></tr>`;
    }).reverse().join("");
    const table = `<div class="card" style="margin-bottom:10px"><div class="tbl-w"><table class="tbl"><tr><th>Месяц</th><th>PLN, zł</th><th>EUR, €</th><th>UAH, ₴</th><th>Итого, $</th><th>Δ</th></tr>${trs}</table></div></div>`;
    const note = `<div class="sub" style="margin-bottom:10px">${fromSheet ? "Итого в $ взято из таблицы." : rates
      ? `Итого в $ пересчитано по текущему курсу: 1 $ = ${rates.PLN.toFixed(2)} zł · ${rates.EUR.toFixed(3)} € · ${rates.UAH.toFixed(2)} ₴ (прошлые месяцы тоже по нему).`
      : "Не удалось получить курс валют: итог в $ посчитать нельзя."}</div>`;
    body.innerHTML = `<div class="kpis">${kpis}</div>${chart}${table}${note}${raw}`;
  }
  return {
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Side $ — доход по месяцам</h1></div>
        <div class="bar"><button class="btn primary" id="d-refresh">${ico.refresh}<span>Обновить</span></button><span class="upd" id="d-upd"></span></div>
        <div id="d-body"></div>`;
      $("#d-refresh", el).onclick = refresh;
      el.onclick = e => { if (e.target.closest("[data-raw]")) { showRaw = !showRaw; draw(); } };
      draw();
      if (!data && !loading && !error) refresh();
    },
  };
})();

/* ============ Реестр модулей ============
   Чтобы добавить раздел: допишите объект в MODULES.
   render(container) — отрисовывает содержимое; без render показывается заглушка «Скоро». */
const MODULES = [
  { id: "stats", title: "Статистика", icon: ico.chart, render: el => Stats.render(el) },
  { id: "wallets", title: "Hyperliquid", icon: ico.wallet, render: el => Wallets.render(el) },
  { id: "checker", title: "HL Checker", icon: ico.shield, render: el => Checker.render(el) },
  { id: "sui", title: "Sui Wallets", icon: ico.drop, render: el => SuiWallets.render(el) },
  { id: "sol", title: "Solana", icon: ico.sol, render: el => SolWallets.render(el) },
  { id: "pythenians", title: "Pythenians", icon: ico.gem, render: el => Pythenians.render(el) },
  { id: "news", title: "Новости", icon: ico.news, render: el => News.render(el) },
  { id: "side", title: "Side $", icon: ico.coin, render: el => SideIncome.render(el) },
  { id: "protocols", title: "Протоколы", icon: ico.globe },
];


/* ============ Кошельки из Google Таблицы ============
   Вкладка с колонками: SUI ADDRESS | EVM ADDRESS | PROFILE (никнейм). Порядок колонок и наличие шапки не важны:
   адреса Sui (0x + 64) и EVM/Hyperliquid (0x + 40) находятся по формату, название — первая ячейка строки, не являющаяся адресом.
   Название вкладки — в sheets (можно перечислить несколько); либо укажите gid вкладки. */
const EXTRA_SHEET = { sheetId: PYTH.sheetId, sheets: ["Wallets"], gid: "" };
async function loadExtraWallets() {
  const base = `https://docs.google.com/spreadsheets/d/${EXTRA_SHEET.sheetId}/gviz/tq?tqx=out:csv`;
  const urls = [...EXTRA_SHEET.sheets.map(s => base + "&sheet=" + encodeURIComponent(s)), ...(EXTRA_SHEET.gid ? [base + "&gid=" + EXTRA_SHEET.gid] : [])];
  const hl = new Map(), sui = new Map(), isHl = s => /^0x[0-9a-fA-F]{40}$/.test(s), isSui = s => /^0x[0-9a-fA-F]{64}$/.test(s);
  for (const url of urls) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const t = await r.text();
      if (t.trimStart().startsWith("<")) continue;
      for (const row of Pythenians.parseCSV(t)) {
        const cells = row.map(c => (c || "").trim());
        const name = cells.find(c => c && !isHl(c) && !isSui(c)) || "";
        for (const c of cells) {
          if (isHl(c)) hl.set(c.toLowerCase(), { address: c, name });
          else if (isSui(c)) sui.set(c.toLowerCase(), { address: c, name });
        }
      }
    } catch (e) { /* вкладки нет или нет доступа — остаются кошельки из кода */ }
  }
  Wallets.add([...hl.values()]); Checker.add([...hl.values()]); SuiWallets.add([...sui.values()]);
}

/* ============ Роутер ============ */
const nav = $("#nav"), view = $("#view");
$("#brand-img").src = ART.av[5];
nav.innerHTML = MODULES.map(m =>
  `<button data-id="${m.id}">${m.icon}<span>${esc(m.title)}</span>${m.render ? "" : '<em class="soon" style="font-style:normal">Скоро</em>'}</button>`).join("");
nav.onclick = e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.id; };

function route() {
  const m = MODULES.find(x => x.id === location.hash.slice(1)) || MODULES[0];
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === m.id));
  document.title = m.title + " · Dashboard";
  const BG = { stats: 8, wallets: 6, sui: 1, checker: 5, sol: 2, pythenians: 7, news: 0, side: 3 };
  $("#bgart").src = ART.big[BG[m.id] ?? 4];
  if (m.render) m.render(view);
  else view.innerHTML = `<div class="stub"><img alt="" src="${ART.big[0]}"><h2>${esc(m.title)}</h2><p>Этот раздел скоро появится.</p></div>`;
}
addEventListener("hashchange", route);
view.innerHTML = '<div class="sub" style="padding:30px 0">Загрузка…</div>';
Promise.race([loadExtraWallets(), sleep(3500)]).then(route);
</script>
