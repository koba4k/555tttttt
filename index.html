<title>Dashboard</title>
<style>
:root{
  --bg:#12141c; --side:#171a24; --card:#1d212d; --card-h:#232837; --line:#2a3040;
  --text:#eef0f6; --mute:#8b93a7; --accent:#7084ff; --accent-bg:rgba(112,132,255,.14);
  --up:#2ed3a0; --down:#ff6b7a; --warn:#f5b84b;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:200px 1fr;min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#7084ff,#9b6bff)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;color:var(--mute);text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--card);color:var(--text)}
.nav button.active{background:var(--accent-bg);color:var(--accent)}
.nav .soon{margin-left:auto;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px}

.main{padding:calc(20px + env(safe-area-inset-top,0px)) clamp(14px,3vw,32px) 32px;min-width:0}
.page{max-width:1120px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:18px;font-weight:650;letter-spacing:-.02em}

.total{background:linear-gradient(160deg,#242a3d,#1d212d);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}
.total small{color:var(--mute)}
.total .sum{font-size:clamp(24px,5vw,30px);font-weight:700;letter-spacing:-.03em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.total .row{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute)}

.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:var(--card);border:1px solid var(--line);transition:background .15s}
.btn:hover{background:var(--card-h)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.btn.primary:hover{background:#8394ff}
.btn[disabled]{opacity:.6;cursor:default}
.btn svg{width:16px;height:16px}
.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.upd{margin-left:auto;color:var(--mute);font-size:12px}

.banner{background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.35);color:#ffb0b8;border-radius:12px;padding:10px 14px;margin-bottom:12px}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px;align-items:start}
.w{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid transparent;border-radius:12px;padding:10px 12px;transition:background .15s,border-color .15s}
.w:hover{background:var(--card-h);border-color:var(--line)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.info{min-width:0;flex:1}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;padding:1px 0;border-radius:6px}
.addr:hover{color:var(--text)}
.addr svg{width:13px;height:13px}
.val{text-align:right;font-variant-numeric:tabular-nums}
.bal{font-size:15px;font-weight:650;letter-spacing:-.01em}
.chg{font-size:12px;font-weight:550}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.err{color:var(--warn);font-size:12.5px;text-align:right}
.err button{color:var(--accent);margin-left:6px;text-decoration:underline}
.sk{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),#343b50,var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.w{flex-wrap:wrap;cursor:pointer}
.w .chev{width:16px;height:16px;margin-left:10px;color:var(--mute);transition:transform .15s}
.w.open .chev{transform:rotate(180deg)}
.w .val{display:flex;align-items:center}
.w .vv{text-align:right}
.det{flex-basis:100%;border-top:1px solid var(--line);margin-top:2px;padding-top:8px;display:grid;gap:5px;font-size:12px;color:var(--mute);cursor:default}
.det .r{display:flex;justify-content:space-between;gap:12px}
.det .r b{color:var(--text);font-weight:550;font-variant-numeric:tabular-nums}
.det .sep{height:1px;background:var(--line);margin:2px 0}
.sub{font-size:11.5px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--mute)}
.kpi .v{font-size:18px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .n{font-size:11px;color:var(--mute);min-height:14px}
.chart{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:4px 10px;border-radius:7px;color:var(--mute)}
.tab.on{background:var(--accent-bg);color:var(--accent)}
.raw{overflow-x:auto;margin-top:10px}
.raw table{border-collapse:collapse;font-size:12px}
.raw td{border:1px solid var(--line);padding:3px 8px;white-space:nowrap}
.card{background:var(--card);border-radius:14px;padding:14px 16px}
.card h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-grid{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:10px;margin-bottom:10px}
.donut{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
.li{display:grid;grid-template-columns:10px 1fr auto 56px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .p{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.li b{font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%}
.brow{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:4px 0;font-variant-numeric:tabular-nums}
.brow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow span:last-child{text-align:right}
.track{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#7084ff,#9b6bff);border-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
@media(max-width:760px){.st-grid{grid-template-columns:1fr}.brow{grid-template-columns:100px 1fr 76px}}
.lvl{font-size:12px;font-weight:650;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:8px;padding:3px 10px;white-space:nowrap}
.chk{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px;border-top:1px solid var(--line);padding-top:8px;font-size:11px;color:var(--mute)}
.chk b{display:block;font-size:12.5px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.lnk{color:var(--accent);text-decoration:underline}
.news{display:flex;flex-direction:column;gap:6px;max-width:880px}
.nw{display:block;background:var(--card);border-radius:12px;padding:10px 14px;color:inherit;text-decoration:none;transition:background .15s}
.nw:hover{background:var(--card-h)}
.nw h4{font-size:13.5px;font-weight:600;margin-bottom:3px;line-height:1.35}
.nw p{color:var(--mute);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw .m{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--mute);align-items:center}
.tag{padding:0 8px;border-radius:10px;border:1px solid var(--line)}
.tag.drop{color:var(--warn);border-color:rgba(245,184,75,.45)}
.tag.new{color:var(--up);border-color:rgba(46,211,160,.45)}
.tag.t{color:var(--accent);border-color:rgba(112,132,255,.4)}
.tbl-w{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{color:var(--mute);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border:0}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:600}
.av img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.mascot{height:64px;width:auto;margin:-6px 0}
.crew{display:flex;gap:14px;align-items:flex-end;overflow-x:auto;margin-bottom:14px;padding:4px 2px}
.crew img{height:86px;width:auto;flex:none;transition:transform .2s}
.crew img:hover{transform:translateY(-4px) rotate(-3deg)}
.brand img{width:30px;height:30px;border-radius:9px;object-fit:contain;background:#2a2147}
.stub img{height:120px;width:auto;margin-bottom:12px}
.bgart{position:fixed;right:max(1.5vw,14px);bottom:0;height:min(48vh,400px);width:auto;opacity:.055;pointer-events:none;z-index:0;transition:opacity .4s}
.main{position:relative;z-index:1}
@media(max-width:760px){.bgart{height:240px;opacity:.04}}
.mchart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:6px}
.mc{flex:1;min-width:20px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:10.5px;color:var(--mute)}
.mc i{display:block;width:100%;max-width:40px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#9b6bff,#7084ff);min-height:2px}
.mc b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--text);font-size:10px}
.stub{text-align:center;padding:80px 20px;color:var(--mute)}
.stub svg{width:40px;height:40px;margin-bottom:12px;opacity:.6}
.stub h2{color:var(--text);font-size:18px;margin-bottom:6px}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:auto 0 0 0;height:auto;z-index:10;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}

/* ============ Hyperliquid API ============ */
async function post(body, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.status === 429) { await sleep(900 * (i + 1)); continue; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      if (i === tries - 1) throw e;
      await sleep(400 * (i + 1));
    }
  }
  throw new Error("Лимит запросов API");
}

// Цены спот-токенов в USD: берём пары с котировкой в USDC (токен №0)
async function loadPrices() {
  const [meta, mids] = await Promise.all([post({ type: "spotMeta" }), post({ type: "allMids" })]);
  const price = { 0: 1 }, byName = {};
  meta.tokens.forEach(t => byName[t.name] = t.index);
  for (const u of meta.universe) {
    if (u.tokens[1] !== 0) continue;
    const p = parseFloat(mids[u.name]);
    if (p && (price[u.tokens[0]] === undefined || u.isCanonical)) price[u.tokens[0]] = p;
  }
  return { price, byName };
}

/* Баланс кошелька = всё, что лежит на Hyperliquid:
   perps + spot (по текущим ценам) + хранилища (vaults) + стейкинг HYPE.
   Unified / Portfolio margin: все балансы живут в spot-аккаунте, поэтому
   вместо accountValue перпов добавляем только нереализованный PnL позиций. */
async function fetchWallet(address, px) {
  const u = { user: address };
  const [st, sp, ab, vl, dl, pf] = await Promise.allSettled([
    post({ type: "clearinghouseState", ...u }),
    post({ type: "spotClearinghouseState", ...u }),
    post({ type: "userAbstraction", ...u }),
    post({ type: "userVaultEquities", ...u }),
    post({ type: "delegatorSummary", ...u }),
    post({ type: "portfolio", ...u }),
  ]);
  for (const r of [st, sp, ab]) if (r.status === "rejected") throw r.reason;

  const mode = typeof ab.value === "string" ? ab.value : "default";
  const unified = mode === "unifiedAccount" || mode === "portfolioMargin";

  const tokens = []; let spotUsd = 0;
  for (const b of sp.value?.balances || []) {
    const total = parseFloat(b.total);
    if (!total) continue;
    const pr = px.price[b.token], usd = pr ? total * pr : 0;
    spotUsd += usd; tokens.push({ coin: b.coin, total, usd, noPrice: !pr });
  }
  tokens.sort((x, y) => y.usd - x.usd);

  const perpsAcc = parseFloat(st.value?.marginSummary?.accountValue) || 0;
  const upnl = (st.value?.assetPositions || []).reduce((s, a) => s + (parseFloat(a.position?.unrealizedPnl) || 0), 0);
  const perps = unified ? upnl : perpsAcc;

  const vaults = vl.status === "fulfilled" && Array.isArray(vl.value)
    ? vl.value.reduce((s, v) => s + (parseFloat(v.equity) || 0), 0) : 0;

  let staking = 0;
  if (dl.status === "fulfilled" && dl.value) {
    const hype = (parseFloat(dl.value.delegated) || 0) + (parseFloat(dl.value.undelegated) || 0) + (parseFloat(dl.value.totalPendingWithdrawal) || 0);
    staking = hype * (px.price[px.byName.HYPE] || 0);
  }

  const parts = [
    { label: unified ? "Perps (PnL позиций)" : "Perps", value: perps },
    { label: "Spot", value: spotUsd },
    { label: "Vaults", value: vaults },
    { label: "Стейкинг HYPE", value: staking },
  ];
  const value = parts.reduce((s, x) => s + x.value, 0);

  // Изменение за 24ч: PnL за период «day» / баланс на начало периода
  let diff = null, pct = null;
  if (pf.status === "fulfilled") {
    const day = (pf.value || []).find(x => x[0] === "day")?.[1];
    const av = day?.accountValueHistory, pnl = day?.pnlHistory;
    if (av?.length) {
      const start = +av[0][1], end = +av[av.length - 1][1];
      diff = pnl?.length > 1 ? +pnl[pnl.length - 1][1] - +pnl[0][1] : end - start;
      pct = start > 0 ? diff / start * 100 : null;
    }
  }
  return { value, diff, pct, mode, parts, tokens };
}

/* ============ Модуль «Wallets» ============ */
const Wallets = (() => {
  const items = WALLETS.map((w, i) => {
    const o = typeof w === "string" ? { address: w } : w;
    return { address: o.address, name: o.name || "Wallet " + (i + 1), idx: i, status: "idle" };
  });
  const open = new Set();
  const MODES = { default: "Standard", disabled: "Standard", dexAbstraction: "Standard", unifiedAccount: "Unified", portfolioMargin: "Portfolio margin" };
  const NOPX = { price: { 0: 1 }, byName: {} };
  let sort = "desc", loading = false, updated = null, root = null, raf = 0, px = null, pxOk = true;

  async function getPrices() {
    try { px = await loadPrices(); pxOk = true; } catch (e) { px = px || NOPX; pxOk = false; }
  }
  async function loadOne(it) {
    it.status = "loading"; paint();
    try { Object.assign(it, await fetchWallet(it.address, px || NOPX), { status: "ok", error: null }); }
    catch (e) { it.status = "error"; it.error = e.message || "Ошибка"; }
    paint();
  }
  async function refresh() {
    if (loading) return;
    loading = true; items.forEach(i => { if (i.status !== "ok") i.status = "loading"; });
    paint();
    await getPrices();
    const queue = items.slice();
    await Promise.all(Array.from({ length: CONCURRENCY }, async () => {
      while (queue.length) await loadOne(queue.shift());
    }));
    loading = false; updated = new Date(); paint();
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && root?.isConnected && updated && Date.now() - updated > 60000) refresh();
  });
  function paint() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }

  function sorted() {
    const a = items.slice();
    if (sort === "desc") a.sort((x, y) => (y.value ?? -1) - (x.value ?? -1));
    else if (sort === "asc") a.sort((x, y) => (x.value ?? Infinity) - (y.value ?? Infinity));
    return a;
  }
  const sortLabel = () => ({ desc: "Сначала большие", asc: "Сначала малые", none: "Как в списке" }[sort]);
  const num = new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 });

  function details(it) {
    const rows = it.parts.filter(x => Math.abs(x.value) >= 0.005)
      .map(x => `<div class="r"><span>${x.label}</span><b>${fmtUsd(x.value)}</b></div>`).join("");
    const toks = it.tokens.filter(t => t.usd >= 0.01 || t.noPrice).slice(0, 8)
      .map(t => `<div class="r"><span>${esc(t.coin)} · ${num.format(t.total)}</span><b>${t.noPrice ? "нет цены" : fmtUsd(t.usd)}</b></div>`).join("");
    return `<div class="det">${rows || '<div class="r"><span>На аккаунте пусто</span></div>'}
      ${toks ? '<div class="sep"></div>' + toks : ""}
      <div class="sep"></div><div class="r"><span>Режим аккаунта</span><b>${MODES[it.mode] || esc(it.mode)}</b></div></div>`;
  }

  function card(it) {
    const isOpen = open.has(it.idx) && it.status === "ok";
    let right;
    if (it.status === "ok") {
      const cls = it.pct == null ? "flat" : it.pct > 0.005 ? "up" : it.pct < -0.005 ? "down" : "flat";
      const sign = it.pct > 0 ? "+" : "";
      right = `<div class="vv"><div class="bal">${fmtUsd(it.value)}</div><div class="chg ${cls}">${it.pct == null ? "—" : sign + it.pct.toFixed(2) + "%"}</div></div>${ico.chev.replace("<svg", '<svg class="chev"')}`;
    } else if (it.status === "error") {
      right = `<div class="err">Не ответил<button data-retry="${it.idx}">Повторить</button></div>`;
    } else {
      right = `<div class="vv"><span class="sk" style="width:90px;margin-left:auto"></span><span class="sk" style="width:50px;margin:8px 0 0 auto"></span></div>`;
    }
    return `<div class="w${isOpen ? " open" : ""}" ${it.status === "ok" ? `data-toggle="${it.idx}" tabindex="0" role="button" aria-expanded="${isOpen}"` : ""}>${avatar(it.address)}
      <div class="info"><div class="name">${esc(it.name)}</div>
      <button class="addr" data-copy="${it.address}" title="Скопировать адрес">${short(it.address)}${ico.copy}</button></div>
      <div class="val">${right}</div>${isOpen ? details(it) : ""}</div>`;
  }

  function draw() {
    if (!root || !root.isConnected) return;
    const ok = items.filter(i => i.status === "ok"), bad = items.filter(i => i.status === "error");
    const total = ok.reduce((s, i) => s + i.value, 0);
    const diff = ok.reduce((s, i) => s + (i.diff || 0), 0);
    const base = total - diff, pct = base > 0 ? diff / base * 100 : null;
    const cls = pct == null ? "flat" : pct >= 0 ? "up" : "down";
    $("#w-total", root).innerHTML = ok.length
      ? `<small>Общий баланс на Hyperliquid</small><div class="sum">${fmtUsd(total)}</div>
         <div class="row"><span class="${cls}">${pct == null ? "—" : (diff >= 0 ? "+" : "−") + fmtUsd(Math.abs(diff)) + " · " + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%"} за 24ч</span><span>Загружено ${ok.length} из ${items.length}</span></div>`
      : `<small>Общий баланс на Hyperliquid</small><div class="sum"><span class="sk" style="width:200px;height:34px"></span></div><div class="row"><span>Загружаем кошельки…</span></div>`;
    $("#w-banner", root).innerHTML =
      (bad.length && !loading ? `<div class="banner">Не удалось загрузить кошельков: ${bad.length}. Остальные показаны, итог посчитан без них.</div>` : "") +
      (!pxOk && !loading ? `<div class="banner">Не удалось получить цены токенов: спот-токены кроме USDC не учтены в сумме.</div>` : "");
    const rb = $("#w-refresh", root);
    rb.disabled = loading; rb.classList.toggle("spin", loading);
    $("#w-sort span", root).textContent = sortLabel();
    $("#w-upd", root).textContent = updated ? "Обновлено в " + updated.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
    $("#w-list", root).innerHTML = sorted().map(card).join("");
  }

  function toggle(i) { open.has(i) ? open.delete(i) : open.add(i); draw(); }

  return {
    refresh, ensure() { if (!updated && !loading) return refresh(); },
    summary() {
      const ok = items.filter(i => i.status === "ok"), sum = k => ok.reduce((s, i) => s + (i[k] || 0), 0);
      return { n: items.length, ok: ok.length, bad: items.filter(i => i.status === "error").length, loading,
        total: sum("value"), diff: sum("diff"),
        parts: [0, 1, 2, 3].map(j => ok.reduce((s, i) => s + (i.parts?.[j]?.value || 0), 0)),
        top: ok.map(i => ({ name: i.name, value: i.value })) };
    },
        add(list) {
      let n = 0;
      for (const w of list) {
        const ex = items.find(i => i.address.toLowerCase() === w.address.toLowerCase());
        if (ex) { if (w.name) ex.name = w.name; continue; }
        items.push({ address: w.address, name: w.name || "Wallet " + (items.length + 1), idx: items.length, status: "idle" }); n++;
      }
      if (n && updated && !loading) refresh(); else paint();
    },
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Hyperliquid Wallets</h1></div>
        <div class="total" id="w-total"></div>
        <div id="w-banner"></div>
        <div class="bar">
          <button class="btn primary" id="w-refresh">${ico.refresh}<span>Обновить</span></button>
          <button class="btn" id="w-sort">${ico.sort}<span></span></button>
          <span class="upd" id="w-upd"></span>
        </div>
        <div class="list" id="w-list"></div>`;
      $("#w-refresh", el).onclick = refresh;
      $("#w-sort", el).onclick = () => { sort = { desc: "asc", asc: "none", none: "desc" }[sort]; draw(); };
      el.onclick = e => {
        const c = e.target.closest("[data-copy]"), r = e.target.closest("[data-retry]");
        if (c) {
          navigator.clipboard?.writeText(c.dataset.copy).then(() => {
            const t = c.innerHTML; c.textContent = "Скопировано"; setTimeout(() => c.innerHTML = t, 900);
          });
          return;
        }
        if (r) { (px ? Promise.resolve() : getPrices()).then(() => loadOne(items[+r.dataset.retry])).then(() => { updated = new Date(); paint(); }); return; }
        const w = e.target.closest("[data-toggle]");
        if (w && !e.target.closest(".det")) toggle(+w.dataset.toggle);
      };
      el.onkeydown = e => {
        const w = e.target.closest?.("[data-toggle]");
        if (w && w === e.target && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(+w.dataset.toggle); }
      };
      draw();
      if (!updated && !loading) refresh();
    },
  };
})();

/* ============ Модуль «Sui Wallets» ============
   Данные: публичный Sui GraphQL (JSON-RPC на mainnet отключён), цены: DeFiLlama. */
const SuiWallets = (() => {
  const GQL = "https://graphql.mainnet.sui.io/graphql", SUI = "0x2::sui::SUI";
  const items = SUI_WALLETS.map((w, i) => {
    const o = typeof w === "string" ? { address: w } : w;
    return { address: o.address, name: o.name || "Sui " + (i + 1), idx: i, status: "idle" };
  });
  const open = new Set(), prices = {};
  let sort = "desc", loading = false, updated = null, root = null, raf = 0;
  const num = new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 });
  const Q = a => `{ address(address: "${a}") {
    balances { nodes { coinType { repr } totalBalance } }
    objects(first: 50, filter: { type: "0x3::staking_pool::StakedSui" }) { nodes { contents { json } } } } }`;

  async function gql(query, tries = 3) {
    for (let i = 0; i < tries; i++) {
      try {
        const r = await fetch(GQL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query }) });
        if (r.status === 429) { await sleep(900 * (i + 1)); continue; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        if (!j.data) throw new Error(j.errors?.[0]?.message || "Пустой ответ");
        return j.data;
      } catch (e) { if (i === tries - 1) throw e; await sleep(500 * (i + 1)); }
    }
    throw new Error("Лимит запросов API");
  }
  async function loadPrices(types) {
    const need = [...new Set(types)].filter(t => !(t in prices));
    for (let i = 0; i < need.length; i += 25) {
      const chunk = need.slice(i, i + 25);
      try {
        const r = await fetch("https://coins.llama.fi/prices/current/" + chunk.map(t => encodeURIComponent("sui:" + t)).join(","));
        const j = await r.json();
        chunk.forEach(t => prices[t] = j.coins?.["sui:" + t] || null);
      } catch (e) { /* повторим при следующем обновлении */ }
    }
    if (!prices[SUI]?.price) {
      try {
        const j = await (await fetch("https://api.coingecko.com/api/v3/simple/price?ids=sui&vs_currencies=usd")).json();
        if (j.sui?.usd) prices[SUI] = { price: j.sui.usd, decimals: 9, symbol: "SUI" };
      } catch (e) {}
    }
  }
  function compute(it, raw) {
    const tokens = []; let tokUsd = 0, hidden = 0;
    for (const n of raw.balances?.nodes || []) {
      const t = n.coinType?.repr, p = prices[t];
      if (!p?.price) { hidden++; continue; }
      const amt = Number(n.totalBalance) / 10 ** (p.decimals ?? 9), usd = amt * p.price;
      tokUsd += usd; tokens.push({ sym: p.symbol || t.split("::").pop(), amt, usd });
    }
    tokens.sort((a, b) => b.usd - a.usd);
    let staked = 0, nStakes = 0;
    for (const o of raw.objects?.nodes || []) {
      const pr = o.contents?.json?.principal;
      staked += (Number(pr && typeof pr === "object" ? pr.value : pr) || 0) / 1e9; nStakes++;
    }
    const stakedUsd = staked * (prices[SUI]?.price || 0);
    Object.assign(it, { status: "ok", error: null, value: tokUsd + stakedUsd, tokUsd, stakedUsd, staked, nStakes, tokens, hidden });
  }
  const getRaw = async it => (await gql(Q(it.address))).address || {};

  async function refresh() {
    if (loading) return;
    loading = true; items.forEach(i => { if (i.status !== "ok") i.status = "loading"; }); paint();
    const raws = [], queue = items.map((_, i) => i);
    await Promise.all(Array.from({ length: 3 }, async () => {
      while (queue.length) {
        const i = queue.shift();
        try { raws[i] = await getRaw(items[i]); } catch (e) { items[i].status = "error"; items[i].error = e.message; }
        paint();
      }
    }));
    await loadPrices([SUI, ...raws.flatMap(r => (r?.balances?.nodes || []).map(n => n.coinType?.repr).filter(Boolean))]);
    items.forEach((it, i) => raws[i] && compute(it, raws[i]));
    loading = false; updated = new Date(); paint();
  }
  async function retry(it) {
    it.status = "loading"; paint();
    try {
      const raw = await getRaw(it);
      await loadPrices([SUI, ...(raw.balances?.nodes || []).map(n => n.coinType?.repr).filter(Boolean)]);
      compute(it, raw);
    } catch (e) { it.status = "error"; it.error = e.message; }
    updated = new Date(); paint();
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && root?.isConnected && updated && Date.now() - updated > 60000) refresh();
  });
  function paint() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  function sorted() {
    const a = items.slice();
    if (sort === "desc") a.sort((x, y) => (y.value ?? -1) - (x.value ?? -1));
    else if (sort === "asc") a.sort((x, y) => (x.value ?? Infinity) - (y.value ?? Infinity));
    return a;
  }
  const sortLabel = () => ({ desc: "Сначала большие", asc: "Сначала малые", none: "Как в списке" }[sort]);

  function details(it) {
    const r = (a, b) => `<div class="r"><span>${a}</span><b>${b}</b></div>`;
    let h = r("Токены", fmtUsd(it.tokUsd));
    if (it.nStakes) h += r(`Стейкинг SUI · ${it.nStakes} поз.`, `${num.format(it.staked)} SUI · ${fmtUsd(it.stakedUsd)}`);
    const toks = it.tokens.filter(t => t.usd >= 0.01).slice(0, 10).map(t => r(`${esc(t.sym)} · ${num.format(t.amt)}`, fmtUsd(t.usd))).join("");
    if (toks) h += '<div class="sep"></div>' + toks;
    if (it.hidden) h += '<div class="sep"></div>' + r("Токены без цены (не в сумме)", it.hidden);
    return `<div class="det">${h}</div>`;
  }
  function card(it) {
    const isOpen = open.has(it.idx) && it.status === "ok";
    let right;
    if (it.status === "ok") {
      right = `<div class="vv"><div class="bal">${fmtUsd(it.value)}</div><div class="sub">${it.stakedUsd >= 0.5 ? "стейк " + fmtUsd(it.stakedUsd) : "&nbsp;"}</div></div>${ico.chev.replace("<svg", '<svg class="chev"')}`;
    } else if (it.status === "error") {
      right = `<div class="err">Не ответил<button data-retry="${it.idx}">Повторить</button></div>`;
    } else {
      right = `<div class="vv"><span class="sk" style="width:80px;margin-left:auto"></span><span class="sk" style="width:46px;margin:7px 0 0 auto"></span></div>`;
    }
    return `<div class="w${isOpen ? " open" : ""}" ${it.status === "ok" ? `data-toggle="${it.idx}" tabindex="0" role="button" aria-expanded="${isOpen}"` : ""}>${avatar(it.address.slice(0, 10) + it.address.slice(-8))}
      <div class="info"><div class="name">${esc(it.name)}</div>
      <button class="addr" data-copy="${it.address}" title="Скопировать адрес">${short(it.address)}${ico.copy}</button></div>
      <div class="val">${right}</div>${isOpen ? details(it) : ""}</div>`;
  }
  function draw() {
    if (!root || !root.isConnected) return;
    const ok = items.filter(i => i.status === "ok"), bad = items.filter(i => i.status === "error");
    const sum = k => ok.reduce((s, i) => s + i[k], 0);
    $("#s-total", root).innerHTML = ok.length
      ? `<small>Общий баланс на Sui</small><div class="sum">${fmtUsd(sum("value"))}</div>
         <div class="row"><span>Токены ${fmtUsd(sum("tokUsd"))}</span><span>Стейкинг ${fmtUsd(sum("stakedUsd"))}</span><span>Загружено ${ok.length} из ${items.length}</span></div>`
      : `<small>Общий баланс на Sui</small><div class="sum"><span class="sk" style="width:180px;height:28px"></span></div><div class="row"><span>Загружаем кошельки…</span></div>`;
    $("#s-banner", root).innerHTML =
      (bad.length && !loading ? `<div class="banner">Не удалось загрузить кошельков: ${bad.length}. Итог посчитан без них.</div>` : "") +
      (!prices[SUI]?.price && !loading && updated ? `<div class="banner">Не удалось получить цену SUI: суммы могут быть занижены.</div>` : "");
    const rb = $("#s-refresh", root);
    rb.disabled = loading; rb.classList.toggle("spin", loading);
    $("#s-sort span", root).textContent = sortLabel();
    $("#s-upd", root).textContent = updated ? "Обновлено в " + updated.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
    $("#s-list", root).innerHTML = sorted().map(card).join("");
  }
  const toggle = i => { open.has(i) ? open.delete(i) : open.add(i); draw(); };
  return {
    refresh, ensure() { if (!updated && !loading) return refresh(); },
    summary() {
      const ok = items.filter(i => i.status === "ok"), sum = k => ok.reduce((s, i) => s + (i[k] || 0), 0);
      return { n: items.length, ok: ok.length, bad: items.filter(i => i.status === "error").length, loading,
        total: sum("value"), tok: sum("tokUsd"), staked: sum("stakedUsd"),
        top: ok.map(i => ({ name: i.name, value: i.value })) };
    },
        add(list) {
      let n = 0;
      for (const w of list) {
        const ex = items.find(i => i.address.toLowerCase() === w.address.toLowerCase());
        if (ex) { if (w.name) ex.name = w.name; continue; }
        items.push({ address: w.address, name: w.name || "Sui " + (items.length + 1), idx: items.length, status: "idle" }); n++;
      }
      if (n && updated && !loading) refresh(); else paint();
    },
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Sui Wallets</h1></div>
        <div class="total" id="s-total"></div>
        <div id="s-banner"></div>
        <div class="bar">
          <button class="btn primary" id="s-refresh">${ico.refresh}<span>Обновить</span></button>
          <button class="btn" id="s-sort">${ico.sort}<span></span></button>
          <span class="upd" id="s-upd"></span>
        </div>
        <div class="list" id="s-list"></div>`;
      $("#s-refresh", el).onclick = refresh;
      $("#s-sort", el).onclick = () => { sort = { desc: "asc", asc: "none", none: "desc" }[sort]; draw(); };
      el.onclick = e => {
        const c = e.target.closest("[data-copy]"), r = e.target.closest("[data-retry]");
        if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => { const t = c.innerHTML; c.textContent = "Скопировано"; setTimeout(() => c.innerHTML = t, 900); }); return; }
        if (r) { retry(items[+r.dataset.retry]); return; }
        const w = e.target.closest("[data-toggle]");
        if (w && !e.target.closest(".det")) toggle(+w.dataset.toggle);
      };
      el.onkeydown = e => {
        const w = e.target.closest?.("[data-toggle]");
        if (w && w === e.target && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(+w.dataset.toggle); }
      };
      draw();
      if (!updated && !loading) refresh();
    },
  };
})();

/* ============ Модуль «Pythenians» ============
   Читает лист из Google Таблицы (CSV через gviz) и сам находит нужные показатели по названиям колонок/строк. */
const Pythenians = (() => {
  const LABELS = { qty: "Количество NFT", buy: "Цена покупки", floor: "Floor", solPrice: "Цена SOL", pnlSol: "P&L", pnlUsd: "P&L", valueUsd: "Стоимость всех NFT" };
  function classify(text) {
    const t = String(text).toLowerCase().trim();
    if (!t || t.length > 60) return null;
    if (/p\s*&?\s*l\b|pnl|прибыл|профит/.test(t)) return /\$|usd|доллар/.test(t) ? "pnlUsd" : /sol/.test(t) ? "pnlSol" : null;
    if (/покуп|buy|bought|purchase/.test(t)) return "buy";
    if (/floor|флор/.test(t)) return "floor";
    if (/стоимост|value|total|итого|worth/.test(t) && /\$|usd|доллар/.test(t)) return "valueUsd";
    if (/sol/.test(t) && /цен|price|курс/.test(t)) return "solPrice";
    if (/колич|кол-во|qty|quantity|amount|count|^шт/.test(t)) return "qty";
    if (/^(дата|date|day|время|time)/.test(t)) return "date";
    return null;
  }
  function parseCSV(t) {
    const rows = []; let r = [], c = "", q = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { r.push(c); c = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; r.push(c); rows.push(r); r = []; c = ""; }
      else c += ch;
    }
    if (c !== "" || r.length) { r.push(c); rows.push(r); }
    return rows;
  }
  function parseNum(s) {
    if (s == null) return null;
    let t = String(s).trim().replace(/[\s\u00a0$€₽◎₴%]|sol|usd|zł|pln|eur|uah|грн|зл/gi, "").replace(/^\+/, "").replace(/[−–]/g, "-");
    if (!t || t === "-") return null;
    t = t.replace(/^\((.*)\)$/, "-$1");
    const hasC = t.includes(","), hasD = t.includes(".");
    if (hasC && hasD) t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
    else if (hasC) t = /,\d{1,2}$/.test(t) && t.split(",").length === 2 ? t.replace(",", ".") : t.replace(/,/g, "");
    return /^-?\d*\.?\d+(e-?\d+)?$/i.test(t) ? parseFloat(t) : null;
  }
  const toTs = s => {
    const m = /^(\d{1,2})[./](\d{1,2})[./](\d{2,4})$/.exec((s || "").trim());
    if (m) return Date.UTC(+m[3] < 100 ? 2000 + +m[3] : +m[3], m[2] - 1, m[1]);
    const t = Date.parse(s); return isNaN(t) ? null : t;
  };
  function extract(rows) {
    const cls = rows.map(r => r.map(c => classify(c || "")));
    let hi = -1, best = 0;
    cls.forEach((r, i) => { const n = new Set(r.filter(Boolean)).size; if (n > best) { best = n; hi = i; } });
    if (best >= 3) {                                   // режим «таблица»: шапка + строки
      const cols = {}; cls[hi].forEach((k, j) => { if (k && !(k in cols)) cols[k] = j; });
      const data = [];
      for (let i = hi + 1; i < rows.length; i++) {
        const rec = {}; let any = false;
        for (const k in cols) {
          if (k === "date") { rec.date = (rows[i][cols[k]] || "").trim(); continue; }
          const v = parseNum(rows[i][cols[k]]); if (v != null) { rec[k] = v; any = true; }
        }
        if (any) data.push(rec);
      }
      if (data.length) return data;
    }
    const rec = {};                                    // режим «название — значение»
    rows.forEach((r, i) => r.forEach((c, j) => {
      const k = cls[i][j]; if (!k || k === "date" || k in rec) return;
      let v = null; for (let d = 1; d <= 3 && v == null; d++) v = parseNum(r[j + d]);
      if (v == null) v = parseNum(rows[i + 1]?.[j]);
      if (v != null) rec[k] = v;
    }));
    return Object.keys(rec).length ? [rec] : null;
  }
  function derive(r) {
    const o = { ...r, calc: {} };
    if (o.valueUsd == null && o.qty != null && o.floor != null && o.solPrice != null) { o.valueUsd = o.qty * o.floor * o.solPrice; o.calc.valueUsd = 1; }
    if (o.pnlSol == null && o.qty != null && o.floor != null && o.buy != null) { o.pnlSol = o.qty * (o.floor - o.buy); o.calc.pnlSol = 1; }
    if (o.pnlUsd == null && o.pnlSol != null && o.solPrice != null) { o.pnlUsd = o.pnlSol * o.solPrice; o.calc.pnlUsd = 1; }
    if (o.qty != null && o.buy != null) {
      let cost = o.qty * o.buy;
      if (o.pnlSol != null && o.floor != null && Math.abs(o.pnlSol - (o.qty * o.floor - o.buy)) < Math.abs(o.pnlSol - (o.qty * o.floor - o.qty * o.buy))) cost = o.buy;
      if (o.pnlSol != null && cost > 0) o.pct = o.pnlSol / cost * 100;
    }
    return o;
  }

  let rows = null, data = null, error = null, loading = false, updated = null, root = null, metric = "pnlUsd", showRaw = false;
  const n4 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 });
  const n0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
  const METRICS = { pnlUsd: ["P&L $", fmtUsd], pnlSol: ["P&L SOL", v => n4.format(v) + " SOL"], valueUsd: ["Стоимость $", fmtUsd], floor: ["Floor", v => n4.format(v) + " SOL"] };

  async function refresh() {
    if (loading) return;
    loading = true; error = null; draw();
    try {
      const base = `https://docs.google.com/spreadsheets/d/${PYTH.sheetId}/gviz/tq?tqx=out:csv`;
      const urls = [base + "&sheet=" + encodeURIComponent(PYTH.sheet), PYTH.gid ? base + "&gid=" + PYTH.gid : null].filter(Boolean);
      let d = null, lastErr = null;
      for (const url of urls) {
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          const t = await r.text();
          if (t.trimStart().startsWith("<")) throw new Error("закрыт доступ");
          const rr = parseCSV(t), dd = extract(rr);
          if (!rows) rows = rr;
          if (dd) { rows = rr; d = dd; break; }
          lastErr = new Error("no-match");
        } catch (e) { lastErr = e; }
      }
      if (!d) throw lastErr || new Error("no-match");
      if (d.every(x => x.date != null && toTs(x.date) != null)) d.sort((a, b) => toTs(a.date) - toTs(b.date));
      data = d.map(derive); updated = new Date();
    } catch (e) {
      error = e.message === "no-match"
        ? "Лист загружен, но я не нашёл в нём нужные названия (Количество, Цена покупки, Floor, P&L…). Откройте «Показать данные листа» и напишите мне, как они выглядят."
        : "Не удалось прочитать таблицу. Откройте доступ: Поделиться → «Все, у кого есть ссылка» → Читатель. Также проверьте, что лист называется «" + PYTH.sheet + "».";
    }
    loading = false; draw();
  }

  function chart(series, key) {
    const pts = series.map(d => d[key]).filter(v => v != null);
    if (pts.length < 2) return "";
    const W = 600, H = 150, pad = 6, min = Math.min(...pts), max = Math.max(...pts), span = max - min || 1;
    const xy = pts.map((v, i) => [pad + i * (W - 2 * pad) / (pts.length - 1), H - pad - (v - min) / span * (H - 2 * pad)]);
    const line = xy.map(a => a.join(",")).join(" ");
    const f = METRICS[key][1];
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;stroke:none" preserveAspectRatio="none">
      <polygon points="${pad},${H} ${line} ${W - pad},${H}" fill="rgba(112,132,255,.14)"/>
      <polyline points="${line}" fill="none" stroke="#7084ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
      <div class="row" style="display:flex;justify-content:space-between;color:var(--mute);font-size:11.5px"><span>мин ${f(min)}</span><span>сейчас ${f(pts[pts.length - 1])}</span><span>макс ${f(max)}</span></div>`;
  }

  function draw() {
    if (!root || !root.isConnected) return;
    const rb = $("#p-refresh", root); rb.disabled = loading; rb.classList.toggle("spin", loading);
    $("#p-upd", root).textContent = updated ? "Обновлено в " + updated.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
    const body = $("#p-body", root);
    if (error) { body.innerHTML = `<div class="banner">${esc(error)}</div>${rawBlock()}`; return; }
    if (!data) { body.innerHTML = `<div class="kpis">${Array(7).fill('<div class="kpi"><span class="sk" style="width:70px"></span><span class="sk" style="width:110px;height:18px;margin-top:8px"></span></div>').join("")}</div>`; return; }
    const d = data[data.length - 1];
    const sgn = v => v == null ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";
    const plus = v => (v > 0 ? "+" : "");
    const kpi = (label, val, cls, note) => `<div class="kpi"><small>${label}</small><div class="v ${cls || ""}">${val}</div><div class="n">${note || ""}</div></div>`;
    const calc = k => d.calc[k] ? "расчёт" : "";
    const cards =
      kpi("Количество NFT", d.qty != null ? n0.format(d.qty) : "—") +
      kpi("Цена покупки", d.buy != null ? n4.format(d.buy) + " SOL" : "—") +
      kpi("Текущий floor", d.floor != null ? n4.format(d.floor) + " SOL" : "—") +
      kpi("Текущая цена SOL", d.solPrice != null ? fmtUsd(d.solPrice) : "—") +
      kpi("P&L SOL", d.pnlSol != null ? plus(d.pnlSol) + n4.format(d.pnlSol) + " SOL" : "—", sgn(d.pnlSol), d.pct != null ? plus(d.pct) + d.pct.toFixed(1) + "%" + (calc("pnlSol") ? " · расчёт" : "") : calc("pnlSol")) +
      kpi("P&L $", d.pnlUsd != null ? plus(d.pnlUsd) + fmtUsd(d.pnlUsd) : "—", sgn(d.pnlUsd), calc("pnlUsd")) +
      kpi("Стоимость всех NFT", d.valueUsd != null ? fmtUsd(d.valueUsd) : "—", "", calc("valueUsd"));
    const avail = Object.keys(METRICS).filter(k => data.filter(x => x[k] != null).length >= 2);
    if (avail.length && !avail.includes(metric)) metric = avail[0];
    const ch = avail.length ? `<div class="chart"><div class="tabs">${avail.map(k => `<button class="tab${k === metric ? " on" : ""}" data-m="${k}">${METRICS[k][0]}</button>`).join("")}</div>${chart(data, metric)}</div>` : "";
    body.innerHTML = `<div class="kpis">${cards}</div>${ch}${data.length > 1 ? `<div class="sub" style="margin-bottom:6px">Точек в истории: ${data.length}</div>` : ""}${rawBlock()}`;
  }
  function rawBlock() {
    if (!rows) return "";
    return `<button class="btn" data-raw="1">${showRaw ? "Скрыть" : "Показать"} данные листа</button>` +
      (showRaw ? `<div class="raw"><table>${rows.slice(0, 60).map(r => "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>").join("")}</table></div>` : "");
  }
  return {
    refresh, parseCSV, parseNum, ensure() { if (!data && !loading && !error) return refresh(); },
    summary() {
      const d = data?.[data.length - 1];
      return { ok: !!d, error: !!error, loading, valueUsd: d?.valueUsd, pnlUsd: d?.pnlUsd, pnlSol: d?.pnlSol, pct: d?.pct, qty: d?.qty };
    },
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Pythenians NFT</h1></div>
        <div class="crew">${ART.big.map(s => `<img alt="" src="${s}">`).join("")}</div>
        <div class="bar">
          <button class="btn primary" id="p-refresh">${ico.refresh}<span>Обновить</span></button>
          <span class="upd" id="p-upd"></span>
        </div>
        <div id="p-body"></div>`;
      $("#p-refresh", el).onclick = refresh;
      el.onclick = e => {
        const m = e.target.closest("[data-m]"), r = e.target.closest("[data-raw]");
        if (m) { metric = m.dataset.m; draw(); }
        if (r) { showRaw = !showRaw; draw(); }
      };
      draw();
      if (!data && !loading && !error) refresh();
    },
  };
})();

/* ============ Модуль «Статистика» ============
   Сводит данные остальных модулей (у каждого есть ensure/summary/refresh). */
const Stats = (() => {
  const COLORS = ["#7084ff", "#9b6bff", "#2ed3a0", "#f5b84b", "#ff6b9d", "#4cc9f0", "#a3e635", "#8b93a7"];
  let root = null, view = "sections", timer = null, sig = "";
  const mods = () => [Wallets, SuiWallets, Pythenians, SolWallets];

  function donut(segs, total) {
    const pos = segs.filter(s => s.value > 0.005), sum = pos.reduce((a, s) => a + s.value, 0);
    if (!sum) return '<div class="sub" style="text-align:center;padding:40px 0">Данные загружаются…</div>';
    const R = 70, C = 2 * Math.PI * R; let off = 0;
    const arcs = pos.map(s => {
      const len = s.value / sum * C;
      const el = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${Math.max(len - 1.5, 0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(s.label)}: ${fmtUsd(s.value)}</title></circle>`;
      off += len; return el;
    }).join("");
    return `<svg class="donut" viewBox="0 0 180 180">${arcs}
      <text x="90" y="86" text-anchor="middle" stroke="none" style="fill:var(--mute);font-size:9px">Всего</text>
      <text x="90" y="104" text-anchor="middle" stroke="none" style="fill:var(--text);font-size:15px;font-weight:700">${fmtUsd(total)}</text></svg>`;
  }

  function draw() {
    if (!root?.isConnected) return;
    const hl = Wallets.summary(), sui = SuiWallets.summary(), py = Pythenians.summary(), sol = SolWallets.summary();
    const nft = py.valueUsd || 0, total = hl.total + sui.total + sol.total + nft;
    const sections = [{ label: "Hyperliquid", value: hl.total }, { label: "Sui", value: sui.total }, { label: "Solana", value: sol.total }, { label: "Pythenians NFT", value: nft }];
    const types = [
      { label: "Perps (HL)", value: hl.parts[0] }, { label: "Spot (HL)", value: hl.parts[1] }, { label: "Vaults (HL)", value: hl.parts[2] },
      { label: "Стейкинг HYPE", value: hl.parts[3] }, { label: "Токены Sui", value: sui.tok }, { label: "Стейкинг SUI", value: sui.staked }, { label: "Solana кошелёк", value: sol.total }, { label: "NFT", value: nft },
    ];
    const segs = (view === "sections" ? sections : types).map((s, i) => ({ ...s, color: COLORS[i % COLORS.length] }));
    const posSum = segs.reduce((a, s) => a + Math.max(0, s.value), 0) || 1;
    const hlBase = hl.total - hl.diff, hlPct = hlBase > 0 ? hl.diff / hlBase * 100 : null;
    const cls = v => v == null ? "flat" : v >= 0 ? "up" : "down";
    const kpi = (l, v, n, c) => `<div class="kpi"><small>${l}</small><div class="v ${c || ""}">${v}</div><div class="n">${n || ""}</div></div>`;
    const kpis =
      kpi("Общий капитал", fmtUsd(total), `HL ${hl.ok}/${hl.n} · Sui ${sui.ok}/${sui.n}`) +
      kpi("Hyperliquid", fmtUsd(hl.total), hlPct == null ? "" : `<span class="${cls(hlPct)}">${hlPct >= 0 ? "+" : ""}${hlPct.toFixed(2)}% за 24ч</span>`) +
      kpi("Sui", fmtUsd(sui.total), `токены ${fmtUsd(sui.tok)} · стейк ${fmtUsd(sui.staked)}`) +
      kpi("Solana", fmtUsd(sol.total), sol.ok ? "SOL " + sol.sol.toFixed(2) : "") +
      kpi("Pythenians NFT", py.ok ? fmtUsd(nft) : "—", py.ok && py.pnlUsd != null ? `<span class="${cls(py.pnlUsd)}">P&L ${py.pnlUsd >= 0 ? "+" : ""}${fmtUsd(py.pnlUsd)}${py.pct != null ? " · " + (py.pct >= 0 ? "+" : "") + py.pct.toFixed(1) + "%" : ""}</span>` : "");
    const legend = segs.map(s => `<div class="li"><i class="dot" style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${fmtUsd(s.value)}</b><span class="p">${s.value > 0 ? (s.value / posSum * 100).toFixed(1) + "%" : "—"}</span></div>`).join("");
    const top = [...hl.top.map(t => ({ name: "HL · " + t.name, value: t.value })), ...sui.top.map(t => ({ name: "Sui · " + t.name, value: t.value }))]
      .sort((a, b) => b.value - a.value).slice(0, 10), mx = top[0]?.value || 1;
    const bars = top.length ? top.map(t => `<div class="brow"><span>${esc(t.name)}</span><div class="track"><div class="fill" style="width:${Math.max(2, t.value / mx * 100)}%"></div></div><span>${fmtUsd(t.value)}</span></div>`).join("") : '<div class="sub">Данные загружаются…</div>';
    const chip = (n, s) => `<span class="chip">${n}: ${s.ok}/${s.n}${s.bad ? " · ошибок " + s.bad : ""}${s.loading ? " …" : ""}</span>`;
    $("#st-body", root).innerHTML = `
      <div class="chips">${chip("Hyperliquid", hl)}${chip("Sui", sui)}<span class="chip">Pythenians: ${py.error ? "ошибка" : py.ok ? "ок" : "…"}</span></div>
      <div class="kpis">${kpis}</div>
      <div class="st-grid">
        <div class="card"><h3>Структура капитала
          <span class="tabs" style="margin:0"><button class="tab${view === "sections" ? " on" : ""}" data-v="sections">Разделы</button><button class="tab${view === "types" ? " on" : ""}" data-v="types">Типы активов</button></span></h3>
          ${donut(segs, total)}</div>
        <div class="card"><h3>Распределение</h3>${legend}</div>
      </div>
      <div class="card"><h3>Топ-10 кошельков</h3>${bars}</div>`;
  }

  function tick() {
    if (!root?.isConnected) { clearInterval(timer); timer = null; return; }
    const a = Wallets.summary(), b = SuiWallets.summary(), c = Pythenians.summary();
    const s = JSON.stringify([a.ok, a.bad, a.loading, a.total, b.ok, b.bad, b.loading, b.total, c, SolWallets.summary().total]);
    if (s !== sig) { sig = s; draw(); }
  }
  return {
    render(el) {
      root = el;
      el.innerHTML = `
        <div class="head"><h1>Статистика</h1><img class="mascot" alt="" src="${ART.big[3]}"></div>
        <div class="bar"><button class="btn primary" id="st-refresh">${ico.refresh}<span>Обновить всё</span></button></div>
        <div id="st-body"></div>`;
      $("#st-refresh", el).onclick = () => mods().forEach(m => m.refresh());
      el.onclick = e => { const t = e.target.closest("[data-v]"); if (t) { view = t.dataset.v; draw(); } };
      mods().forEach(m => m.ensure());
      draw();
      clearInterval(timer); timer = setInterval(tick, 600);
    },
  };
})();

/* ============ Модуль «HL Checker» ============
   Повторяет условия чекера hypemoto.xyz/level (Rider / Degen / OG / Legend) по публичным данным. */
const Checker = (() => {
  const LV = [{ n: "Уровень 0", c: "#8b93a7" }, { n: "Rider", c: "#2ed3a0" }, { n: "Degen", c: "#7084ff" }, { n: "OG", c: "#f5b84b" }, { n: "Legend", c: "#ff6b9d" }];
  const EVM = "https://rpc.hyperliquid.xyz/evm", UNIT = "https://api.hyperunit.xyz/operations/";
  const TTL = 6 * 3600e3, DEC = { eth: 1e18, btc: 1e8, sol: 1e9 };
  const items = WALLETS.map((w, i) => {
    const o = typeof w === "string" ? { address: w } : w;
    return { address: o.address, name: o.name || "Wallet " + (i + 1), idx: i, status: "idle" };
  });
  let loading = false, updated = null, root = null, raf = 0;

  const cacheGet = a => { try { const c = JSON.parse(localStorage.getItem("hlchk:" + a)); return c && Date.now() - c.ts < TTL ? c : null; } catch (e) { return null; } };
  const cacheSet = (a, d) => { try { localStorage.setItem("hlchk:" + a, JSON.stringify({ ts: Date.now(), d })); } catch (e) {} };

  async function postRL(body) {            // у fills большой «вес» запроса → ждём при 429
    for (let i = 0; i < 6; i++) {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.status === 429) { await sleep(2500 * (i + 1)); continue; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    throw new Error("Лимит запросов API");
  }
  async function evmTx(a) {
    const r = await fetch(EVM, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_getTransactionCount", params: [a, "latest"] }) });
    const j = await r.json(); if (j.error) throw new Error(j.error.message);
    return parseInt(j.result, 16);
  }
  async function unitOps(a) {
    const r = await fetch(UNIT + a); if (!r.ok) throw new Error("HTTP " + r.status);
    return (await r.json()).operations || [];
  }
  function level(m) {
    const age = m.age ?? 0, tx = m.evmTx ?? 0, vol = m.hlVol ?? 0, xyz = m.xyzVol ?? 0, eth = m.ethEq ?? 0, comb = vol + xyz;
    let l = 0;
    if ((age >= 3 && (tx >= 10 || vol >= 1e5 || xyz >= 25e3 || eth >= 0.1)) || xyz >= 50e3) l = 1;
    if (age >= 30 && (tx >= 30 || eth >= 0.5 || comb >= 1e5)) l = 2;
    if (age >= 90 && (tx >= 100 || xyz >= 25e4 || eth >= 1)) l = 3;
    if (age >= 180 && (xyz >= 5e5 || eth >= 5)) l = 4;
    return l;
  }
  async function check(a, px) {
    const [tx, fl, lg, un] = await Promise.allSettled([
      evmTx(a), postRL({ type: "userFills", user: a }),
      postRL({ type: "userNonFundingLedgerUpdates", user: a, startTime: 0 }), unitOps(a)]);
    if ([tx, fl, lg, un].every(r => r.status === "rejected")) throw tx.reason;
    const m = { partial: [] }, firsts = [];
    if (tx.status === "fulfilled") m.evmTx = tx.value; else m.partial.push("HyperEVM");
    if (fl.status === "fulfilled") {
      let vol = 0, xyz = 0;
      for (const f of fl.value) { const v = +f.px * +f.sz; vol += v; if ((f.coin || "").startsWith("xyz:")) xyz += v; firsts.push(f.time); }
      m.hlVol = vol; m.xyzVol = xyz; m.fills = fl.value.length;
    } else m.partial.push("сделки");
    if (lg.status === "fulfilled") { if (lg.value[0]?.time) firsts.push(lg.value[0].time); } else m.partial.push("леджер");
    if (un.status === "fulfilled") {
      let eth = 0;
      for (const op of un.value) {
        if ((op.destinationChain || "").toLowerCase() !== "hyperliquid") continue;
        const t = Date.parse(op.opCreatedAt); if (!isNaN(t)) firsts.push(t);
        const asset = (op.asset || "").toLowerCase();
        if ((op.state || "").toLowerCase() !== "done" || !DEC[asset] || !px[asset]) continue;
        eth += Number(op.sourceAmount) / DEC[asset] * px[asset] / px.eth;
      }
      m.ethEq = eth;
    } else m.partial.push("Unit");
    m.age = firsts.length ? (Date.now() - Math.min(...firsts)) / 864e5 : 0;
    m.level = level(m);
    return m;
  }
  async function getPx() {
    try { const m = await postRL({ type: "allMids" }); return { btc: +m.BTC, eth: +m.ETH, sol: +m.SOL }; } catch (e) { return { eth: 0 }; }
  }
  async function runOne(it, px) {
    it.status = "loading"; paint();
    try { const d = await check(it.address, px); Object.assign(it, d, { status: "ok" }); if (!d.partial.length) cacheSet(it.address, d); }
    catch (e) { it.status = "error"; it.error = e.message; }
    paint();
  }
  async function refresh(force) {
    if (loading) return;
    loading = true;
    const todo = [];
    for (const it of items) {
      const c = !force && cacheGet(it.address);
      if (c) Object.assign(it, c.d, { status: "ok" }); else { it.status = "loading"; todo.push(it); }
    }
    paint();
    if (todo.length) {
      const px = await getPx(), q = todo.slice();
      await Promise.all(Array.from({ length: 2 }, async () => { while (q.length) await runOne(q.shift(), px); }));
    }
    loading = false; updated = new Date(); paint();
  }
  function paint() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }

  const k = v => v == null ? "—" : "$" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "k" : v.toFixed(0));
  function card(it) {
    const lv = LV[it.level || 0];
    let right;
    if (it.status === "ok") right = `<span class="lvl" style="--c:${lv.c}" title="${it.partial.length ? "Не загрузилось: " + esc(it.partial.join(", ")) + " — уровень может быть занижен" : ""}">${lv.n}${it.partial.length ? "*" : ""}</span>`;
    else if (it.status === "error") right = `<div class="err">Не ответил<button data-retry="${it.idx}">Повторить</button></div>`;
    else right = `<span class="sk" style="width:60px"></span>`;
    const st = it.status === "ok" ? `<div class="chk">
      <span>Возраст<b>${it.age ? Math.floor(it.age) + " д" : "—"}</b></span><span>EVM tx<b>${it.evmTx ?? "—"}</b></span>
      <span>HL объём<b>${k(it.hlVol)}</b></span><span>xyz объём<b>${k(it.xyzVol)}</b></span>
      <span>Unit, ETH<b>${it.ethEq == null ? "—" : it.ethEq.toFixed(2)}</b></span></div>` : "";
    return `<div class="w">${avatar(it.address)}<div class="info"><div class="name">${esc(it.name)}</div>
      <button class="addr" data-copy="${it.address}" title="Скопировать адрес">${short(it.address)}${ico.copy}</button></div>

    $("#c-list", root).innerHTML = items.slice().sort((a, b) => (b.level ?? -1) - (a.level ?? -1) || (b.hlVol ?? 0) - (a.hlVol ?? 0)).map(card).join("");
